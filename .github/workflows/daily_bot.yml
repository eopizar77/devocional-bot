name: Daily Devocional Bot

on:
  schedule:
    # Corre a las 10:00 AM UTC (que son las 5:00 AM hora de Colombia)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Permite correrlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Ejecutar el bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        GREEN_INSTANCE: ${{ secrets.GREEN_INSTANCE }}
        GREEN_TOKEN: ${{ secrets.GREEN_TOKEN }}
      run: |
        python scraper.py
